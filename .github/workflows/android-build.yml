name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.7.2")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building BlitzCount version: ${VERSION}"

      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "keystore_path=${{ github.workspace }}/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded successfully."
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "No keystore secret found, skipping release signing."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug & Release APKs and AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.app_version.outputs.version }}"
          
          # Debug APK
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/BlitzCount-v${VERSION}-debug.apk
          fi
          
          # Release APK
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/BlitzCount-v${VERSION}.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BlitzCount-v${VERSION}-unsigned.apk
          fi
          
          # Release AAB (Play Store)
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab artifacts/BlitzCount-v${VERSION}.aab
          fi
          
          ls -la artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlitzCount-debug-apk
          path: artifacts/*debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlitzCount-release-apk
          path: |
            artifacts/BlitzCount-v*.apk
            artifacts/BlitzCount-v*-unsigned.apk
          retention-days: 30

      - name: Upload Release AAB Bundle (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: BlitzCount-playstore-aab
          path: artifacts/*.aab
          retention-days: 30

      - name: Publish GitHub Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
