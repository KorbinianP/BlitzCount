<?xml version="1.0" encoding="UTF-8"?>
<svg class="counti-mascot counti-idle" viewBox="0 0 120 120" width="160" height="160" xmlns="http://www.w3.org/2000/svg">
      <!-- Soft Ambient Shadow -->
      <ellipse cx="60" cy="113" rx="38" ry="5.5" fill="rgba(69, 38, 21, 0.14)" />

      <!-- Cute Small Rounded Capybara Ears -->
      <ellipse cx="27" cy="30" rx="7.5" ry="8.5" transform="rotate(-20 27 30)" fill="#D29873" stroke="#452615" stroke-width="3" />
      <ellipse cx="28" cy="31" rx="4" ry="5" transform="rotate(-20 27 30)" fill="#80492B" />

      <ellipse cx="93" cy="30" rx="7.5" ry="8.5" transform="rotate(20 93 30)" fill="#D29873" stroke="#452615" stroke-width="3" />
      <ellipse cx="92" cy="31" rx="4" ry="5" transform="rotate(20 93 30)" fill="#80492B" />

      <!-- Chubby Loaf Body (Seated posture) -->
      <path d="M 36 68 
               C 22 76, 18 92, 21 102 
               C 24 109, 34 110, 60 110 
               C 86 110, 96 109, 99 102 
               C 102 92, 98 76, 84 68 Z" 
            fill="#D29873" 
            stroke="#452615" 
            stroke-width="3.2" 
            stroke-linejoin="round" />

      <!-- Characteristic Capybara Head Shape (Flat-topped crown, soft sloping cheeks) -->
      <path d="M 37 26 
               Q 60 23 83 26 
               C 97 29, 99 48, 97 63 
               C 95 76, 83 80, 60 80 
               C 37 80, 25 76, 23 63 
               C 21 48, 23 29, 37 26 Z" 
            fill="#D29873" 
            stroke="#452615" 
            stroke-width="3.2" 
            stroke-linejoin="round" />

      <!-- Distinctive Darker Snout / Muzzle Patch (Vertical rounded bean/oval) -->
      <path d="M 44 45 
               C 44 38, 76 38, 76 45 
               C 77 56, 78 72, 60 72 
               C 42 72, 43 56, 44 45 Z" 
            fill="#935A39" 
            stroke="#452615" 
            stroke-width="2.8" 
            stroke-linejoin="round" />

      <!-- Capybara Nostril Slits -->
      <path d="M 52 51 C 51 54, 53 56, 56 54" stroke="#452615" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <path d="M 68 51 C 69 54, 67 56, 64 54" stroke="#452615" stroke-width="2.6" stroke-linecap="round" fill="none" />
      
      <!-- Philtrum Line -->
      <line x1="60" y1="53" x2="60" y2="61" stroke="#452615" stroke-width="2.6" stroke-linecap="round" />

      <!-- Rosy Blush Cheeks -->
      <ellipse cx="31" cy="56" rx="5.5" ry="4" fill="#FF8FA3" opacity="0.9" />
      <ellipse cx="89" cy="56" rx="5.5" ry="4" fill="#FF8FA3" opacity="0.9" />

      <!-- Eyes -->
      
        <ellipse cx="37" cy="44" rx="4.5" ry="5.5" fill="#452615" />
        <circle cx="35.5" cy="42" r="1.8" fill="#FFF" />
        <circle cx="38.5" cy="45.5" r="0.9" fill="#FFF" />
        <ellipse cx="83" cy="44" rx="4.5" ry="5.5" fill="#452615" />
        <circle cx="81.5" cy="42" r="1.8" fill="#FFF" />
        <circle cx="84.5" cy="45.5" r="0.9" fill="#FFF" />
      

      <!-- Mouth -->
      
        <path d="M 53 62 Q 60 67 67 62" stroke="#452615" stroke-width="2.6" stroke-linecap="round" fill="none" />
      

      <!-- Front Paws -->
      
        <g class="front-paws">
          <ellipse cx="49" cy="104" rx="7" ry="5.5" fill="#D29873" stroke="#452615" stroke-width="2.6" />
          <line x1="49" y1="102" x2="49" y2="108" stroke="#452615" stroke-width="2" stroke-linecap="round" />
          <ellipse cx="71" cy="104" rx="7" ry="5.5" fill="#D29873" stroke="#452615" stroke-width="2.6" />
          <line x1="71" y1="102" x2="71" y2="108" stroke="#452615" stroke-width="2" stroke-linecap="round" />
        </g>
      

      <!-- Mood-Specific Extras (Orange, Party Hat, Medal, Flower, Sparkles) -->
      
        <!-- Iconic Japanese onsen Yuzu / Orange on Counti's head -->
        <circle cx="60" cy="19" r="8" fill="#FFA726" stroke="#452615" stroke-width="2.2" />
        <!-- Little green stem & leaf -->
        <path d="M 60 11 Q 64 7 67 9 Q 64 14 60 11 Z" fill="#66BB6A" stroke="#452615" stroke-width="1.6" />
      
    </svg>
